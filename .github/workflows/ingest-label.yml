name: ingest-observation
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: data-branch
  cancel-in-progress: false
jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'observation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/checkout_data.sh
      - name: Parse issue → labels.csv
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          python scripts/ingest_label.py > result.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.parse.outputs.code == '0'
        run: bash scripts/publish_data.sh label
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file result.txt
          gh issue close ${{ github.event.issue.number }}
