name: keepalive
# 公開 repo 60 天無活動會停用排程。每月在 main 留一筆空 commit 保險(每小時對 data 分支的 commit 是否算活動,我沒有驗證)。
on:
  schedule:
    - cron: "23 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive $(date -u +%F)"
          git push
